media:
  input: src/media
  output: src/media
content:
  - name: news
    label: News
    type: collection
    path: src/content/news
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: string
        required: true
      - name: date
        type: date
        required: true
      - name: listserv
        type: select
        options:
          values:
            - name: igwc-ue-l
              label: Member Email List
            - name: igwc-ue-news-l
              label: Newsletter
        description: Select which footer (with social media and unsubscribe links) will be appended to the newsletter
        required: true
      - name: body
        type: rich-text
